name: ranking

on:
  schedule:
    # 9h BRT (12h UTC) nos primeiros 3 dias úteis do mês
    - cron: "0 12 1 * *"
    - cron: "0 12 2 * *"
    - cron: "0 12 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ranking
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --allow-build=@biomejs/biome --allow-build=esbuild

      - name: Cache COTAHIST
        uses: actions/cache@v4
        with:
          path: data/cache
          key: cotahist-${{ github.run_id }}
          restore-keys: |
            cotahist-

      - name: Gerar ranking
        run: pnpm rank

      - name: Commit ranking e docs
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add data/rankings docs
          git commit -m "ranking $(date +%Y-%m)" || exit 0
          git push

      - name: Notificar Telegram
        run: pnpm notify
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
